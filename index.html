<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏆 鲸周奖励中心</title>
  <script src="https://telegram.org"></script>
  <script src="./config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #070b14 url('./IMG_1117.jpeg') center center / cover no-repeat fixed;
      color: #f9fafb;
      padding: 14px 14px 86px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .box { max-width: 480px; margin: 0 auto; }
    .card {
      background: rgba(11, 17, 32, 0.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .user-left { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #111827; font-weight: 900; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.45);
    }
    .uname { font-size: 15px; font-weight: 700; color: #fff; }
    .ubadge { display: inline-block; font-size: 11px; color: #fbbf24; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.35); padding: 1px 8px; border-radius: 10px; margin-top: 3px; }
    .mode-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .nav-btn {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a; text-decoration: none;
      padding: 8px 4px; border-radius: 9px; font-size: 12px; font-weight: 600;
    }

    .pts-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(17, 24, 39, 0.92));
      border: 1px solid rgba(251, 191, 36, 0.55);
    }
    .pts-title { font-size: 12px; color: #fde68a; }
    .pts-main { font-size: 36px; font-weight: 900; color: #fbbf24; margin: 4px 0 10px; }
    .pts-sub { display: flex; justify-content: space-between; font-size: 12px; color: #d1d5db; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    .pts-sub b { color: #fff; }

    .checkin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .day-box { background: rgba(10, 15, 28, 0.85); border: 1px solid #374151; border-radius: 10px; padding: 8px 4px; text-align: center; }
    .day-box.day7 { grid-column: span 2; }
    .day-box.done { border-color: #10b981; background: rgba(16, 185, 129, 0.18); opacity: 0.7; }
    .day-box.today { border-color: #fbbf24; background: rgba(245, 158, 11, 0.25); box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
    .day-num { font-size: 11px; color: #9ca3af; }
    .day-pts { font-size: 14px; font-weight: 800; color: #fbbf24; margin-top: 2px; }

    .act-btn {
      background: linear-gradient(90deg, #fbbf24, #d97706);
      color: #111827; border: none; border-radius: 10px;
      padding: 10px 14px; font-size: 13px; font-weight: 800;
      cursor: pointer; white-space: nowrap; transition: 0.15s;
    }
    .act-btn:active { transform: scale(0.96); }
    .act-btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; transform: none; }
    .full-btn { width: 100%; padding: 12px; font-size: 14px; }

    .action-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .act-info h3 { font-size: 15px; color: #fff; margin-bottom: 3px; }
    .act-info p { font-size: 12px; color: #9ca3af; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(75, 85, 99, 0.4); gap: 8px; }
    .task-item:last-child { border-bottom: none; }
    .task-name { font-size: 13px; font-weight: 600; color: #f3f4f6; }
    .task-desc { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .task-pts { font-size: 12px; color: #fbbf24; font-weight: 700; margin-top: 2px; }

    /* 活跃充值表单样式 */
    .rule { background: rgba(245, 158, 11, 0.16); border-left: 3px solid #f59e0b; padding: 9px 11px; font-size: 12px; color: #fde68a; margin-bottom: 12px; border-radius: 4px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .item { background: rgba(10, 15, 28, 0.8); border: 1.5px solid #374151; border-radius: 10px; padding: 10px 8px; text-align: center; position: relative; cursor: pointer; }
    .item.full { grid-column: span 2; }
    .item.active { border-color: #fbbf24 !important; background: rgba(245, 158, 11, 0.28) !important; }
    .item.disabled { opacity: 0.45; }
    .tag { position: absolute; top: -7px; right: 6px; background: #dc2626; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; }
    .u { font-size: 13px; font-weight: 700; }
    .c { font-size: 20px; font-weight: 800; color: #fbbf24; }
    .d { font-size: 11px; color: #9ca3af; }
    label { display: block; font-size: 12px; margin: 10px 0 5px; color: #e5e7eb; }
    input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #4b5563; background: rgba(10, 15, 28, 0.9); color: #fff; font-size: 13px; }
    .upload-box { border: 1.5px dashed #6b7280; border-radius: 8px; background: rgba(10, 15, 28, 0.85); padding: 14px; text-align: center; position: relative; }
    .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .preview-wrap { display: none; position: relative; z-index: 3; }
    .preview-wrap img { max-width: 100%; max-height: 180px; border-radius: 6px; }
    .del-img { position: absolute; top: 6px; right: 6px; background: #dc2626; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; z-index: 4; }
    .msg { margin-top: 10px; padding: 9px; border-radius: 8px; font-size: 12px; display: none; }
    .ok { display: block; background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border: 1px solid #10b981; }
    .err { display: block; background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid #ef4444; }

    .ref-box { background: rgba(10, 15, 28, 0.85); border: 1px solid #374151; border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
    .ref-link { font-size: 12px; color: #d1d5db; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ref-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; margin-top: 10px; }
    .stat-box { background: rgba(10, 15, 28, 0.75); padding: 10px; border-radius: 10px; border: 1px solid #374151; }
    .stat-val { font-size: 18px; font-weight: 800; color: #fbbf24; }
    .stat-lbl { font-size: 11px; color: #9ca3af; }

    .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(75, 85, 99, 0.4); font-size: 13px; }
    .hist-plus { color: #34d399; font-weight: 700; }

    .page { display: none; }
    .page.active { display: block; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(251, 191, 36, 0.25);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 8px 0 12px; z-index: 50;
    }
    .b-item { text-align: center; color: #9ca3af; font-size: 11px; cursor: pointer; user-select: none; }
    .b-item.active { color: #fbbf24; font-weight: 700; }
    .b-icon { font-size: 18px; display: block; margin-bottom: 2px; }

    .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #111827; border: 1.5px solid #fbbf24; border-radius: 18px; padding: 24px 20px; text-align: center; width: 100%; max-width: 300px; box-shadow: 0 10px 30px rgba(251, 191, 36, 0.35); animation: popIn 0.25s ease-out; }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-pts { font-size: 34px; font-weight: 900; color: #fbbf24; margin: 8px 0; }
    .modal-title { font-size: 14px; color: #e5e7eb; margin-bottom: 18px; }
    .flying-coin { position: fixed; font-size: 22px; z-index: 200; pointer-events: none; transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.75s ease-in; }
  </style>
</head>
<body>
  <div class="box">
    <div class="card">
      <div class="user-row">
        <div class="user-left">
          <div class="avatar" id="uAvatar">U</div>
          <div>
            <div class="uname" id="uName">访客</div>
            <div class="ubadge" id="uBadge">Lv.1 · 新人</div>
          </div>
        </div>
        <span class="mode-tag" id="modeTag">演示模式</span>
      </div>
      <div class="nav-grid">
        <a class="nav-btn" href="https://t.me" onclick="openTg(event, 'https://t.me')">📢 官方频道</a>
        <a class="nav-btn" href="https://t.me" onclick="openTg(event, 'https://t.me')">💬 交流群组</a>
