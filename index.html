<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>月度活跃奖励中心</title>
  <!-- 引入 Telegram WebApp 官方 SDK -->
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f5f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1f2329);
      --hint-color: var(--tg-theme-hint-color, #8f959e);
      --btn-color: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: rgba(143, 149, 158, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* 顶部用户信息卡片 */
    .header-card {
      background: linear-gradient(135deg, #2481cc 0%, #1a66a8 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.2);
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
    }

    .user-id {
      font-size: 12px;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .points-label {
      font-size: 13px;
      opacity: 0.85;
    }

    .points-value {
      font-size: 32px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* 通用卡片样式 */
    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 规则提示框 */
    .notice-box {
      background-color: rgba(217, 119, 6, 0.1);
      border-left: 3px solid #d97706;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .notice-box p {
      margin-bottom: 4px;
    }

    .notice-box p:last-child {
      margin-bottom: 0;
    }

    /* 档位选择网格 */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .tier-item {
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tier-item.active {
      border-color: var(--btn-color);
      background-color: rgba(36, 129, 204, 0.08);
    }

    .tier-amount {
      font-size: 18px;
      font-weight: 700;
      color: var(--btn-color);
    }

    .tier-desc {
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 4px;
    }

    /* 表单输入框 */
    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--btn-color);
    }

    /* 主按钮 */
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: var(--btn-color);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .submit-btn:active {
      opacity: 0.8;
    }

    /* 申请记录列表 */
    .record-empty {
      text-align: center;
      color: var(--hint-color);
      font-size: 13px;
      padding: 20px 0;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .record-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .record-info-title {
      font-size: 14px;
      font-weight: 600;
    }

    .record-info-time {
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .status-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: rgba(217, 119, 6, 0.12);
      color: #d97706;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部积分与账户概览 -->
    <div class="header-card">
      <div class="user-row">
        <span class="user-name" id="userName">未连接 Telegram</span>
        <span class="user-id" id="userId">ID: --</span>
      </div>
      <div class="points-label">当前可用活跃积分</div>
      <div class="points-value" id="userPoints">0 积分</div>
    </div>

    <!-- 奖励领取申请区 -->
    <div class="card">
      <div class="card-title">🎁 月度活跃奖励领取</div>

      <div class="notice-box">
        <p>📅 <strong>发放时间</strong>：每月 15 号、30 号统一审核发放</p>
        <p>⚠️ <strong>领取限制</strong>：高额档位每月 15 号开放一次申请</p>
      </div>

      <div class="tier-grid" id="tierGrid">
        <div class="tier-item active" data-tier="基础活跃档 (10 积分)">
          <div class="tier-amount">10 积分</div>
          <div class="tier-desc">15号 / 30号可领</div>
        </div>
        <div class="tier-item" data-tier="进阶活跃档 (30 积分)">
          <div class="tier-amount">30 积分</div>
          <div class="tier-desc">15号 / 30号可领</div>
        </div>
        <div class="tier-item" data-tier="高级活跃档 (50 积分)">
          <div class="tier-amount">50 积分</div>
          <div class="tier-desc">仅限每月 15 号</div>
        </div>
        <div class="tier-item" data-tier="尊享活跃档 (200 积分)">
          <div class="tier-amount">200 积分</div>
          <div class="tier-desc">仅限每月 15 号</div>
        </div>
      </div>

      <div class="input-group">
        <label for="remarkInput">备注信息（选填，如接收账号或活动说明）</label>
        <input type="text" id="remarkInput" placeholder="请输入备注信息..." />
      </div>

      <button class="submit-btn" id="submitBtn">提交领取申请</button>
    </div>

    <!-- 申请记录 -->
    <div class="card">
      <div class="card-title">📜 我的申请记录</div>
      <div id="recordList">
        <div class="record-empty">暂无领取记录</div>
      </div>
    </div>
  </div>

  <script>
    // 1. 初始化 Telegram Mini App
    const tg = window.Telegram?.WebApp;
    let currentUserId = "guest";

    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        currentUserId = String(user.id);
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
        document.getElementById("userName").textContent = fullName || user.username || "Telegram 用户";
        document.getElementById("userId").textContent = `ID: ${user.id}`;
      }
    }

    // 2. 档位选择交互
    let selectedTier = "基础活跃档 (10 积分)";
    const tierItems = document.querySelectorAll(".tier-item");

    tierItems.forEach((item) => {
      item.addEventListener("click", () => {
        tierItems.forEach((el) => el.classList.remove("active"));
        item.classList.add("active");
        selectedTier = item.getAttribute("data-tier");
      });
    });

    // 3. 读取与渲染本地记录
    const STORAGE_KEY = `reward_records_${currentUserId}`;

    function loadRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const records = raw ? JSON.parse(raw) : [];
      const listEl = document.getElementById("recordList");

      if (records.length === 0) {
        listEl.innerHTML = `<div class="record-empty">暂无领取记录</div>`;
        return;
      }

      listEl.innerHTML = records
        .map(
          (item) => `
          <div class="record-item">
            <div>
              <div class="record-info-title">${item.tier}</div>
              <div class="record-info-time">${item.time}${item.remark ? " · " + item.remark : ""}</div>
            </div>
            <span class="status-badge">${item.status}</span>
          </div>
        `
        )
        .join("");
    }

    // 4. 提交申请逻辑
    document.getElementById("submitBtn").addEventListener("click", () => {
      const remark = document.getElementById("remarkInput").value.trim();
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(
        now.getDate()
      ).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

      const raw = localStorage.getItem(STORAGE_KEY);
      const records = raw ? JSON.parse(raw) : [];

      records.unshift({
        tier: selectedTier,
        remark: remark,
        time: timeStr,
        status: "审核中",
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      document.getElementById("remarkInput").value = "";
      loadRecords();

      if (tg && tg.showAlert) {
        tg.showAlert(`已成功提交【${selectedTier}】申请，请等待审核发放！`);
      } else {
        alert(`已成功提交【${selectedTier}】申请，请等待审核发放！`);
      }
    });

    // 页面加载时初始化记录列表
    loadRecords();
  </script>
</body>
</html>
