<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>月度活跃奖励中心</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; color: #1f2329; padding: 16px; line-height: 1.5; }
    .container { max-width: 480px; margin: 0 auto; }
    .header-card { background: linear-gradient(135deg, #2481cc, #1a66a8); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(36,129,204,0.2); }
    .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .user-name { font-size: 16px; font-weight: 600; }
    .user-id { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 12px; }
    .points-label { font-size: 13px; opacity: 0.85; }
    .points-value { font-size: 30px; font-weight: 700; margin-top: 2px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid #e5e7eb; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .notice-box { background: #fef3c7; border-left: 3px solid #d97706; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; color: #92400e; }
    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .tier-item { border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; }
    .tier-item.active { border-color: #2481cc; background: #eff6ff; }
    .tier-amount { font-size: 18px; font-weight: 700; color: #2481cc; }
    .tier-desc { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; outline: none; }
    .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2481cc; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .submit-btn:disabled { opacity: 0.6; }
    .status-msg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; word-break: break-all; }
    .status-msg.success { display: block; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-msg.error { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .record-empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 16px 0; }
    .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .record-item:last-child { border-bottom: none; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #fef3c7; color: #d97706; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <div class="user-row">
        <span class="user-name" id="userName">未连接 Telegram</span>
        <span class="user-id" id="userId">ID: --</span>
      </div>
      <div class="points-label">当前可用活跃积分</div>
      <div class="points-value">0 积分</div>
    </div>

    <div class="card">
      <div class="card-title">🎁 月度活跃奖励领取</div>
      <div class="notice-box">
        <p>📅 <strong>发放时间</strong>：每月 15 号、30 号统一审核发放</p>
        <p>⚠️ <strong>领取限制</strong>：高额档位每月 15 号开放一次申请</p>
      </div>

      <div class="tier-grid" id="tierGrid">
        <div class="tier-item active" data-tier="基础活跃档 (10 积分)">
          <div class="tier-amount">10 积分</div>
          <div class="tier-desc">15号 / 30号可领</div>
        </div>
        <div class="tier-item" data-tier="进阶活跃档 (30 积分)">
          <div class="tier-amount">30 积分</div>
          <div class="tier-desc">15号 / 30号可领</div>
        </div>
        <div class="tier-item" data-tier="高级活跃档 (50 积分)">
          <div class="tier-amount">50 积分</div>
          <div class="tier-desc">仅限每月 15 号</div>
        </div>
        <div class="tier-item" data-tier="尊享活跃档 (200 积分)">
          <div class="tier-amount">200 积分</div>
          <div class="tier-desc">仅限每月 15 号</div>
        </div>
      </div>

      <div class="input-group">
        <label>备注信息（选填，如接收账号或活动说明）</label>
        <input type="text" id="remarkInput" placeholder="请输入备注信息..." />
      </div>

      <button class="submit-btn" id="submitBtn">提交领取申请</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">📜 我的申请记录</div>
      <div id="recordList"><div class="record-empty">暂无领取记录</div></div>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "9267340308:AAF-HyhX0Fa_UnvLFmpPbzO22jRmcJGTMH4";
    const ADMIN_CHAT_ID = "8522211759";

    const tg = window.Telegram && window.Telegram.WebApp;
    let userInfo = { id: "网页直接访问", name: "未连接 Telegram", username: "无" };

    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user) {
        userInfo = {
          id: String(user.id),
          name: [user.first_name, user.last_name].filter(Boolean).join(" ") || "Telegram用户",
          username: user.username ? "@" + user.username : "未设置"
        };
        document.getElementById("userName").textContent = userInfo.name;
        document.getElementById("userId").textContent = "ID: " + userInfo.id;
      }
    }

    let selectedTier = "基础活跃档 (10 积分)";
    document.querySelectorAll(".tier-item").forEach(item => {
      item.onclick = () => {
        document.querySelectorAll(".tier-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        selectedTier = item.getAttribute("data-tier");
      };
    });

    const STORAGE_KEY = "reward_records_" + userInfo.id;
    function loadRecords() {
      const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      const listEl = document.getElementById("recordList");
      if (!records.length) {
        listEl.innerHTML = '<div class="record-empty">暂无领取记录</div>';
        return;
      }
      listEl.innerHTML = records.map(r => `
        <div class="record-item">
          <div>
            <div style="font-size:14px;font-weight:600">${r.tier}</div>
            <div style="font-size:12px;color:#6b7280">${r.time}${r.remark ? " · " + r.remark : ""}</div>
          </div>
          <span class="badge">${r.status}</span>
        </div>
      `).join("");
    }

    function showStatus(text, isSuccess) {
      const box = document.getElementById("statusMsg");
      box.textContent = text;
      box.className = "status-msg " + (isSuccess ? "success" : "error");
    }

    document.getElementById("submitBtn").onclick = async function () {
      const btn = this;
      const remark = document.getElementById("remarkInput").value.trim();
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

      const msg = [
        "🔔 <b>收到新的奖励领取申请</b>",
        "━━━━━━━━━━━━━━",
        `👤 <b>申请人</b>：${userInfo.name}`,
        `🔗 <b>用户名</b>：${userInfo.username}`,
        `🆔 <b>用户ID</b>：<code>${userInfo.id}</code>`,
        `🎁 <b>申请档位</b>：${selectedTier}`,
        `📝 <b>备注信息</b>：${remark || "无"}`,
        `🕒 <b>提交时间</b>：${timeStr}`
      ].join("\n");

      btn.disabled = true;
      btn.textContent = "正在提交中...";
      document.getElementById("statusMsg").className = "status-msg";

      try {
        const res = await fetch(`https://telegram.org{BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: msg, parse_mode: "HTML" })
        });
        const data = await res.json();

        if (data.ok) {
          const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          records.unshift({ tier: selectedTier, remark, time: timeStr, status: "已发送审核" });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
          document.getElementById("remarkInput").value = "";
          loadRecords();
          showStatus("✅ 提交成功！审核通知已发送到管理员机器人。", true);
        } else {
          showStatus(`❌ 发送失败：${data.description}（请确保已在 Telegram 中向你的机器人发送过 /start）`, false);
        }
      } catch (err) {
        showStatus("❌ 网络请求失败：当前网络无法连接 Telegram 接口，请检查网络或代理设置。", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "提交领取申请";
      }
    };

    loadRecords();
  </script>
</body>
</html>
